<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự báo mức độ đầy thùng rác</title>
</head>
<body>
    <h1>Dự báo mức độ đầy thùng rác</h1>
    <p>Nhấn vào nút dưới đây để xem kết quả dự báo:</p>
    <button onclick="getForecast()">Dự báo</button>

    <h2>Kết quả dự báo:</h2>
    <pre id="forecastResult"></pre>

    <script>
        function getForecast() {
            // Gửi yêu cầu AJAX đến API Golang
            fetch('http://localhost:8080/forecast')
                .then(response => response.json())
                .then(data => {
                    // Hiển thị kết quả dự báo trên trang web
                    document.getElementById('forecastResult').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    console.error('Lỗi khi lấy dữ liệu dự báo:', error);
                });
        }
    </script>
</body>
</html>
